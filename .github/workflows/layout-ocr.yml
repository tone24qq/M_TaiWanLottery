name: Layout OCR checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [work]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SCRAPER_ENABLED: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Blind baseline verifies pinned work-HEAD sources.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip check
      - run: python -m pytest -q tests
      - run: node --check taiwan_lottery/static/js/layout.js
      # Private images are intentionally absent. Their local acceptance is
      # separately recorded; a skip here is not a real-image regression pass.
